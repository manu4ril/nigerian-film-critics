<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nigerian Film Critics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5f2ea;font-family:Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#0b0beF0;border-bottom:1px solid #292929;z-index:5}.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px}.brand b{color:#e4a83a}.nav button{background:none;border:0;color:#ddd;margin-left:18px;cursor:pointer}.hero{padding:75px 0;border-bottom:1px solid #292929}.eyebrow{color:#e4a83a;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(48px,8vw,92px);line-height:.9;margin:14px 0}.hero p{max-width:650px;color:#aaa;font-size:18px;line-height:1.6}.section{padding:42px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.input,.select,textarea{background:#141414;border:1px solid #333;color:#fff;border-radius:9px;padding:12px}.input{min-width:280px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:#151515;border:1px solid #292929;border-radius:14px}.card{overflow:hidden;cursor:pointer}.poster{height:260px;background:linear-gradient(135deg,#322b20,#171717);display:flex;align-items:center;justify-content:center;color:#777;font-weight:900}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.muted{color:#999}.score{color:#e4a83a;font-weight:900}.admin{display:none}.admin.active{display:block}.public.hidden{display:none}.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.gold{background:#e4a83a;color:#111}.dark{background:#282828;color:#fff}.danger{background:#722;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.box{background:#151515;border:1px solid #333;border-radius:15px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;padding:12px 0}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.input{min-width:0;width:100%}}
</style></head><body><header><div class="wrap nav"><div class="brand">NIGERIAN <b>FILM CRITICS</b></div><div><button onclick="home()">Reviews</button><button onclick="openLogin()">Admin</button></div></div></header>
<main id="public" class="public"><div class="wrap"><section class="hero"><div class="eyebrow">Independent Nigerian cinema criticism</div><h1 id="name">Nigerian Film Critics</h1><p id="intro">Independent reviews, criticism and conversations about Nigerian film.</p></section><section class="section"><div class="controls"><input id="q" class="input" placeholder="Search films, directors or genres" oninput="render()"><select id="cat" class="select" onchange="render()"><option value="">All categories</option><option>Nollywood</option><option>Documentary</option><option>International</option><option>Classics</option></select></div><div id="films" class="grid"></div></section><section class="section"><h2>Critics</h2><div id="critics" class="grid"></div></section></div></main>
<main id="admin" class="admin"><div class="wrap"><section class="section"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">Private publishing desk</div><h2>Admin Dashboard</h2></div><button class="btn dark" onclick="logout()">Sign out</button></div><div class="controls"><button class="btn gold" onclick="newFilm()">+ Film</button><button class="btn dark" onclick="newCritic()">+ Critic</button></div><div class="panel" id="adminList"></div></section></div></main>
<div id="login" class="modal"><div class="box"><h2>Admin sign in</h2><input id="email" class="input" placeholder="Email"><br><br><input id="pass" type="password" class="input" placeholder="Password"><br><br><button class="btn gold" onclick="signin()">Sign in</button><button class="btn dark" onclick="closeAll()">Cancel</button><p id="err"></p></div></div>
<div id="editor" class="modal"><div class="box"><h2 id="et">Film</h2><div class="form"><input id="ft" class="input" placeholder="Title"><input id="fy" class="input" placeholder="Year"><input id="fg" class="input" placeholder="Genre"><select id="fc" class="select"><option>Nollywood</option><option>Documentary</option><option>International</option><option>Classics</option></select><input id="fd" class="input" placeholder="Director"><input id="fp" class="input" placeholder="Poster URL"><input id="fs" class="input" placeholder="Score /10"><select id="fcr" class="select"></select><textarea id="fsummary" class="full" rows="3" placeholder="Summary"></textarea><textarea id="freview" class="full" rows="8" placeholder="Review"></textarea></div><p><label><input id="pub" type="checkbox"> Published</label></p><button class="btn gold" onclick="saveFilm()">Save</button> <button class="btn dark" onclick="closeAll()">Cancel</button></div></div>
<div id="critic" class="modal"><div class="box"><h2>New critic</h2><input id="cn" class="input" placeholder="Name"><br><br><input id="ca" class="input" placeholder="Photo URL"><br><br><textarea id="cb" class="input" rows="6" placeholder="Biography"></textarea><br><br><button class="btn gold" onclick="saveCritic()">Save</button> <button class="btn dark" onclick="closeAll()">Cancel</button></div></div>
<script>
let sb,films=[],critics=[],editing=null,user=null;
async function boot(){let c=await (await fetch('/api/config')).json();if(!c.url){intro.textContent='Connect Supabase in Vercel Environment Variables to activate the publication.';return}sb=supabase.createClient(c.url,c.key);let s=await sb.auth.getSession();user=s.data.session?.user||null;await load();if(user&&await adminQ())showAdmin()}
async function load(){let s=await sb.from('settings').select('*').eq('id',1).single();if(s.data){name.textContent=s.data.site_name;intro.textContent=s.data.intro}let c=await sb.from('critics').select('*').order('name');critics=c.data||[];let f=await sb.from('films').select('*,critics(name)').order('created_at',{ascending:false});films=f.data||[];render();renderCritics()}
function render(){let x=films.filter(f=>(!q.value||[f.title,f.director,f.genre].join(' ').toLowerCase().includes(q.value.toLowerCase()))&&(!cat.value||f.category===cat.value));filmsEl=x}
Object.defineProperty(window,'filmsEl',{set(){},get(){return null}});
function draw(){let x=films.filter(f=>(!q.value||[f.title,f.director,f.genre].join(' ').toLowerCase().includes(q.value.toLowerCase()))&&(!cat.value||f.category===cat.value));document.getElementById('films').innerHTML=x.map(f=>'<article class="card" onclick="view('+f.id+')"><div class="poster">'+(f.poster_url?'<img src="'+esc(f.poster_url)+'">':'NFC')+'</div><div class="body"><div class="muted">'+(f.year||'')+' · '+esc(f.genre||f.category||'')+'</div><h3>'+esc(f.title)+'</h3><div class="score">'+(f.score??'—')+'/10</div><p class="muted">'+esc(f.summary||'')+'</p></div></article>').join('')||'<p class="muted">No films found.</p>'}
render=draw;
function renderCritics(){document.getElementById('critics').innerHTML=critics.map(c=>'<div class="panel body"><div class="eyebrow">Critic</div><h3>'+esc(c.name)+'</h3><p class="muted">'+esc(c.bio||'')+'</p></div>').join('')||'<p class="muted">No critics yet.</p>'}
function view(id){let f=films.find(x=>x.id===id);if(!f)return;document.getElementById('editor').querySelector('.box').innerHTML='<h2>'+esc(f.title)+'</h2><div class="muted">'+(f.year||'')+' · '+esc(f.genre||'')+' · '+esc(f.director||'')+'</div><h3 class="score">'+(f.score??'—')+'/10</h3><p>'+esc(f.review||f.summary||'')+'</p><button class="btn dark" onclick="closeAll()">Close</button>';document.getElementById('editor').classList.add('show')}
async function adminQ(){let r=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!r.data}
async function signin(){let r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error){err.textContent=r.error.message;return}user=r.data.user;if(await adminQ()){closeAll();showAdmin()}else{await sb.auth.signOut();err.textContent='This account is not an administrator.'}}
function showAdmin(){public.classList.add('hidden');admin.classList.add('active');adminList.innerHTML=films.map(f=>'<div class="row"><span><b>'+esc(f.title)+'</b><br><small class="muted">'+esc(f.category||'')+' · '+(f.published?'Published':'Draft')+'</small></span><span><button class="btn dark" onclick="editFilm('+f.id+')">Edit</button> <button class="btn danger" onclick="delFilm('+f.id+')">Delete</button></span></div>').join('')}
function home(){public.classList.remove('hidden');admin.classList.remove('active')}
function openLogin(){login.classList.add('show')}function closeAll(){location.reload()}
function newFilm(){editing=null;clearFilm();fillCritics();et.textContent='New film';editor.classList.add('show')}
function clearFilm(){ft.value=fy.value=fg.value=fd.value=fp.value=fs.value=fsummary.value=freview.value='';fc.value='Nollywood';pub.checked=false}
function fillCritics(){fcr.innerHTML='<option value="">No critic</option>'+critics.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')}
function editFilm(id){let f=films.find(x=>x.id===id);editing=id;fillCritics();ft.value=f.title;fy.value=f.year||'';fg.value=f.genre||'';fc.value=f.category||'Nollywood';fd.value=f.director||'';fp.value=f.poster_url||'';fs.value=f.score||'';fcr.value=f.critic_id||'';fsummary.value=f.summary||'';freview.value=f.review||'';pub.checked=!!f.published;et.textContent='Edit film';editor.classList.add('show')}
async function saveFilm(){let row={title:ft.value,year:Number(fy.value)||null,genre:fg.value,category:fc.value,director:fd.value,poster_url:fp.value,score:Number(fs.value)||null,critic_id:fcr.value?Number(fcr.value):null,summary:fsummary.value,review:freview.value,published:pub.checked,updated_at:new Date().toISOString()};let r=editing?await sb.from('films').update(row).eq('id',editing):await sb.from('films').insert(row);if(r.error)return alert(r.error.message);location.reload()}
function newCritic(){cn.value=ca.value=cb.value='';critic.classList.add('show')}
async function saveCritic(){let r=await sb.from('critics').insert({name:cn.value,avatar_url:ca.value,bio:cb.value});if(r.error)return alert(r.error.message);location.reload()}
async function delFilm(id){if(!confirm('Delete this film?'))return;let r=await sb.from('films').delete().eq('id',id);if(r.error)alert(r.error.message);else location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
boot();
</script></body></html>
